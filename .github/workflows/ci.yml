name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true
          install: >-
            make
            wget
            zip
            p7zip
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Install Dependencies
        run: >
          pacman -Syu &&
          pacman --noconfirm -S mingw-w64-x86_64-toolchain mingw-w64-x86_64-mpv
      - name: Run tests
        run: go test -tags migrated_fynedo ./backend/... ./ui/shortcuts/...
      - name: Install Fyne tool
        run: go install fyne.io/fyne/v2/cmd/fyne@latest
      - name: Package
        run: make package_windows
      - name: Download mpv dll
        run: >
          wget https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z &&
          7z x mpv-dev-x86_64-20260610-git-304426c.7z
      - name: Download smtc dll
        run: >
          wget https://github.com/supersonic-app/smtc-dll/releases/download/v0.1.2/SMTC.dll
      - name: Generate zip bundle
        run: >
          zip Supersonic_windows_x64.zip Supersonic.exe libmpv-2.dll SMTC.dll
      - name: Generate installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: win_inno_installscript.iss
      - name: Rename installer
        run: cp Output/supersonic-installer.exe Supersonic_windows_x64_installer.exe
      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: Supersonic_windows_x64.zip
          path: Supersonic_windows_x64.zip
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Supersonic_windows_x64_installer.exe
          path: Supersonic_windows_x64_installer.exe
