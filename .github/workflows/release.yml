name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            make
            wget
            zip
            p7zip
            mingw-w64-ucrt-x86_64-toolchain
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Download mpv dev & dll
        run: |
          wget -q https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-20260610-git-304426c.7z
          7z x -y mpv-dev-x86_64-20260610-git-304426c.7z
          cp -r include/mpv /ucrt64/include/
          cp libmpv.dll.a /ucrt64/lib/
          cp libmpv-2.dll /ucrt64/bin/
      - name: Run tests
        run: go test -tags migrated_fynedo ./backend/... ./ui/shortcuts/...
      - name: Install Fyne tool
        run: go install fyne.io/fyne/v2/cmd/fyne@latest
      - name: Package
        run: make package_windows
      - name: Download smtc dll
        run: >
          wget -q https://github.com/supersonic-app/smtc-dll/releases/download/v0.1.2/SMTC.dll
      - name: Generate zip bundle
        run: >
          zip Supersonic_windows_x64.zip Supersonic.exe libmpv-2.dll SMTC.dll
      - name: Generate installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: win_inno_installscript.iss
      - name: Rename installer
        run: cp Output/supersonic-installer.exe Supersonic_windows_x64_installer.exe
      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: Supersonic_windows_x64.zip
          path: Supersonic_windows_x64.zip
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Supersonic_windows_x64_installer.exe
          path: Supersonic_windows_x64_installer.exe

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
